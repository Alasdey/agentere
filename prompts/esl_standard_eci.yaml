system: |
  # Context
  EventStoryLine (ESL) v0.9 is an English news corpus annotated for event causality.
  Documents are newswire articles grouped into topics (real-world event clusters).
  Event mentions are marked inline as <ID text> (e.g. <14 checks into>, <5 conviction>).
  Use the numeric ID from each tag as the mention identifier in your output.
  Causal annotation covers both intra- and inter-sentence pairs; relations were annotated
  wherever the link was judged direct and clear. [Reference: Caselli & Vossen, ACL 2017.]

  ## Label Set (Use these exact strings)
  - **"causes"**: Ti causes/enables/leads to or prevents the absence of Tj (Ti → Tj).
  - **"causedby"**: Tj causes/enables/leads to or prevents the absence of Ti (Tj → Ti).
  - **"norel"**: No justified causal link (reject temporal-only, correlation-only, or vague plausibility).

  # Precision-First Rules (Apply Silently)
  1. **Two-Signal Rule** for any non-overt link (i.e., no clear connective like "because/so/therefore/lead to/due to"): require at least **two independent signals** among:
      - a. Counterfactual asymmetry (but-for)
      - b. A concrete **mechanism** in the text (not just world knowledge)
      - c. Strong discourse evidence (e.g., apposition/relative clause clearly encoding causality)
      - d. Local lexical patterns of enablement/prevention
    If fewer than two signals are present → **norel**.

  2. **Distance/Scope Gate:** For **inter-sentential** pairs OR pairs with long textual distance, raise the bar:
      - Must pass counterfactual AND include **either** an explicit cue **or** a spelled-out mechanism. Otherwise, label **norel**.
      - Treat long-range links conservatively.

  3. **Default to norel when Uncertain:** If evidence is ambiguous, underspecified, or equally well explained by correlation, reporting, or chronology → **norel**.

  4. **Confounder & Chain Check:** If another event more directly explains Tj, label Ti,Tj as **norel**; do not "skip over" the proximal cause.

  5. **Reporting/Attribution is Not Causal:** Events like "said", "reported", "claimed" are not causes of the content unless the **content event** is enabled/prevented by the speech act itself.

  6. **Negation/Contrast is Not Causality:** Connectives such as "although", "however", or "despite" do not justify causal labels unless the rules above are explicitly/implicitly satisfied.

  7. **Direction Test:** Use counterfactuals to establish directionality. If neither direction is necessary, or both seem plausible, → **norel**.

  8. **Temporal Discourse is Not Causal:** Temporal connectives and markers — such as "then", "when", "after", "before", "as", "while", "next", "subsequently", "later" — indicate sequencing or co-occurrence only, NOT causation. A temporal link alone, no matter how strongly ordered, does NOT satisfy any causal signal and must be treated as **norel** unless at least one independent non-temporal signal is also present.

  9. **Causal Symmetry:** Every "A causes B" must always be paired with "B causedby A", and vice versa. There are no exceptions. If you cannot justify the symmetric entry, reconsider the relation.

  Before producing the final JSON, reason through the following steps IN ORDER:

  Step 1 — Pre-filter: justify exclusions by mention or group.
  Work at the mention level, not the pair level. Identify individual mentions or
  groups of mentions that have no conceivable causal connection to any other
  mention in the set — and explicitly justify why each is excluded. A group of
  N mentions produces up to N*(N-1)/2 pairs: name the group once and give the
  reason, rather than enumerating every pair.
  Exclusion must be affirmatively argued (e.g. "<3 conviction> describes a legal
  status with no agentive role — it cannot cause or be caused by any event here")
  — do NOT use "everything else has no probability" as a catch-all.
  Only after stating and justifying all exclusions, list the mentions that remain
  in scope for Steps 2–3.

  Step 2 — Arguments for and against.
  For each retained pair from Step 1, present:
  - **For**: signals supporting a causal link (explicit connective, spelled-out
    mechanism, counterfactual asymmetry, discourse structure encoding causality,
    enablement/prevention pattern).
  - **Against**: disqualifying factors (temporal-only link, distance gate not
    met, confounder or proximal cause, reporting/attribution verb, negation/
    contrast connective, direction ambiguity, etc.).

  Step 3 — Order by causal plausibility, then output JSON.
  Rank the retained pairs from strongest to weakest causal evidence (qualitative
  only — no numeric scores or probabilities). Apply the Precision-First Rules to
  assign a label to each. Then output the final JSON array for ALL causal pairs
  found (omit a pair entirely to mark it norel).

  # Output Format
  - Use the numeric mention ID from each <ID text> tag as the identifier.
  - Follow the provided JSON structure exactly.
  - Use only the approved label strings: "causes", "causedby", "norel".
  - Omitting a pair signals norel — only output pairs you label causes or causedby.
  - Every "causes" entry must be accompanied by its symmetric "causedby" entry.

  If there are no mentions in the text and no pairs to classify, return an empty array [].

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

user_template: |

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

  Rules:
  - Labels: "causes" | "causedby" | "norel".
  - Consider explicit AND implicit causality; include enablement and prevention as causal.
  - Mention IDs come from the <ID text> tags in the text (e.g. <14 checks into> → ID is "14").
  - Return ONLY a JSON array of causal pairs (omit a pair to mark it norel):
  [
    {{"pair":"14,44","label":"causes"}},
    {{"pair":"44,14","label":"causedby"}}
  ]

  Coherence Rules:
  - Symmetry: "A,B" "causes" implies "B,A" "causedby" and inversely — both must appear.
  - Omission: Any pair you leave out is treated as norel.
  - Contradiction: "A,B" "norel" is incompatible with "A,B" "causes" or "A,B" "causedby".

  Text:
  {doc_text}

  Predict all the pairs of mentions.

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.
