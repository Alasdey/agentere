system: |
  # Context
  MAVEN-ERE is a large-scale English event relation extraction dataset built on Wikipedia articles
  covering diverse real-world topics. Event mentions are marked inline as <ID text>
  (e.g. <e3 collapsed>, <e12 earthquake>). Use the alphanumeric ID from each tag as the
  mention identifier in your output.
  Causal annotation covers CAUSE (direct causation) and PRECONDITION (enabling condition);
  both map to "causes"/"causedby" in the label set below.
  Relations are both intra- and inter-sentence; Wikipedia prose frequently has long-range causal
  links spanning several sentences. [Reference: Wang et al., ACL 2022.]

  ## Coreference Propagation
  Some mentions are coreferent — they refer to the same real-world event even though they are
  tagged with different IDs. If mention A and mention B are coreferent, and mention A is found
  to be in a causal relation with mention C, that same causal relation must also hold between
  mention B and mention C. Concretely: if "A,C" is "causes", then for every mention B coreferent
  with A, "B,C" must also be "causes" (and symmetrically "C,B" must be "causedby"). Apply this
  propagation transitively across an entire coreference chain — a relation discovered for any one
  member of the chain must be asserted for every other member of that chain.

  ## Label Set (Use these exact strings)
  - **"causes"**: Ti causes/enables/leads to or prevents the absence of Tj (Ti → Tj).
  - **"causedby"**: Tj causes/enables/leads to or prevents the absence of Ti (Tj → Ti).
  - **"norel"**: No justified causal link (reject temporal-only, correlation-only, or vague plausibility).

  Before producing the final JSON, reason through the following steps IN ORDER:

  Step 1 — Pre-filter: justify exclusions by mention or group.
  Work at the mention level, not the pair level. Identify individual mentions or
  groups of mentions that have no conceivable causal connection to any other
  mention in the set — and explicitly justify why each is excluded. A group of
  N mentions produces up to N*(N-1)/2 pairs: name the group once and give the
  reason, rather than enumerating every pair.
  Exclusion must be affirmatively argued (e.g. "<e5 located> describes a static
  spatial relation with no agentive role — it cannot cause or be caused by any event here")
  — do NOT use "everything else has no probability" as a catch-all.
  Only after stating and justifying all exclusions, list the mentions that remain
  in scope for Steps 2–3.

  Step 2 — Arguments for and against.
  For each retained pair from Step 1, present:
  - **For**: signals supporting a causal link (explicit connective, spelled-out
    mechanism, counterfactual asymmetry, discourse structure encoding causality,
    enablement/prevention pattern).
  - **Against**: disqualifying factors (temporal-only link, distance gate not
    met, confounder or proximal cause, reporting/attribution verb, negation/
    contrast connective, direction ambiguity, etc.).

  Step 3 — Order by causal plausibility, then output JSON.
  Rank the retained pairs from strongest to weakest causal evidence (qualitative
  only — no numeric scores or probabilities). Apply the Precision-First Rules to
  assign a label to each. Then, before finalizing, propagate every relation across
  coreference chains as described above so that all coreferent mentions carry the
  same relations as their chain-mates. Then output the final JSON array for ALL
  causal pairs found (omit a pair entirely to mark it norel).

  # Output Format
  - Use the alphanumeric mention ID from each <ID text> tag as the identifier.
  - Follow the provided JSON structure exactly.
  - Use only the approved label strings: "causes", "causedby", "norel".
  - Omitting a pair signals norel — only output pairs you label causes or causedby.
  - Every "causes" entry must be accompanied by its symmetric "causedby" entry.
  - Every relation must be propagated across coreference chains: if A and B corefer, any
    relation held by A must also be output for B (and vice versa).

  If there are no mentions in the text and no pairs to classify, return an empty array [].

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

user_template: |

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.

  Rules:
  - Labels: "causes" | "causedby" | "norel".
  - Consider explicit AND implicit causality; include enablement and prevention as causal.
  - Mention IDs come from the <ID text> tags in the text (e.g. <e3 collapsed> → ID is "e3").
  - Return ONLY a JSON array of causal pairs (omit a pair to mark it norel):
  [
    {{"pair":"e3,e12","label":"causes"}},
    {{"pair":"e12,e3","label":"causedby"}}
  ]

  Coreference Rules:
  - If mention A and mention B are coreferent (refer to the same real-world event), then any
    causal relation found between A and some other mention C must also be asserted between B
    and C: "A,C" "causes" implies "B,C" "causes" (and "C,B" "causedby") for every B coreferent
    with A.
  - Apply this propagation transitively across the full coreference chain — a relation found
    for one member of the chain must be output for every member of that chain.

  Coherence Rules:
  - Symmetry: "A,B" "causes" implies "B,A" "causedby" and inversely — both must appear.
  - Omission: Any pair you leave out is treated as norel.
  - Contradiction: "A,B" "norel" is incompatible with "A,B" "causes" or "A,B" "causedby".

  Text:
  {doc_text}

  Predict all causal pairs among the event mentions in the text.

  IMPORTANT:
  No matter what, start your answer with 'UwU', then go through Steps 1 to 3, then output the final JSON.
