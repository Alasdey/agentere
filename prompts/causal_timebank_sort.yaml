system: |
  # Context
  CausalTimeBank (CTB) extends TimeBank with event-event causal annotations over English newswire text (Mirza et al., 2014). Only **intra-sentential** pairs are annotated — every pair you receive is guaranteed to come from the same sentence. Causal links are often signaled by explicit C-SIGNALs ("because", "since", "as a result", "due to", "so that", etc.), but implicit same-sentence causality is also annotated. [Reference: LREC'14 CausalTimeBank paper.]

  ## Label Set (Use these exact strings)
  - **"CauseEffect"**: Ti causes/enables/leads to or prevents the absence of Tj (Ti → Tj).
  - **"EffectCause"**: Tj causes/enables/leads to or prevents the absence of Ti (Tj → Ti).
  - **"NoRel"**: No justified causal link (reject temporal-only, correlation-only, or vague plausibility).

  # Precision-First Rules (Apply Silently)
  1. **Two-Signal Rule** for any non-overt link (i.e., no clear C-SIGNAL connective like "because/since/therefore/lead to/due to/as a result"): require at least **two independent signals** among:
      - a. Counterfactual asymmetry (but-for)
      - b. A concrete **mechanism** in the text (not just world knowledge)
      - c. Strong discourse evidence (e.g., apposition/relative clause clearly encoding causality)
      - d. Local lexical patterns of enablement/prevention
    If fewer than two signals are present → **NoRel**.

  2. **Default to NoRel when Uncertain:** If evidence is ambiguous, underspecified, or equally well explained by correlation, reporting, or chronology → **NoRel**.

  3. **Confounder & Chain Check:** If another event in the same sentence more directly explains Tj, label Ti,Tj as **NoRel**; do not "skip over" the proximal cause.

  4. **Reporting/Attribution is Not Causal:** Events like "said", "reported", "claimed" are not causes of the content unless the **content event** is enabled/prevented by the speech act itself.

  5. **Negation/Contrast is Not Causality:** Connectives such as "although", "however", or "despite" do not justify causal labels unless the rules above are explicitly satisfied.

  6. **Direction Test:** Use counterfactuals to establish directionality. If neither direction is necessary, or both seem plausible, → **NoRel**.

  7. **Temporal Discourse is Not Causal:** Temporal connectives and markers — such as "then", "when", "after", "before", "as", "while", "next", "subsequently", "later" — indicate sequencing or co-occurrence only, NOT causation. A temporal link alone does NOT satisfy any causal signal and must be treated as **NoRel** unless at least one independent non-temporal signal is also present.

  8. **Causal Symmetry:** Every EffectCause a, b must always have a CauseEffect b, a. Every CauseEffect b, a must always have an EffectCause a, b. There can be no exception ever. If you cannot classify the symmetric: reconsider the relation.

  Before producing the final JSON, reason through the following steps IN ORDER:

  Step 1 — Pre-filter: justify exclusions by mention or group.
  Work at the mention level, not the pair level. Identify individual mentions or
  groups of mentions that have no conceivable causal connection to any other
  mention in the set — and explicitly justify why each is excluded. A group of
  N mentions produces up to N*(N-1)/2 pairs: name the group once and give the
  reason, rather than enumerating every pair.
  Exclusion must be affirmatively argued (e.g. "T3 describes a geographical
  location with no agentive role — it cannot cause or be caused by any event
  here") — do NOT use "everything else has no probability" as a catch-all.
  Only after stating and justifying all exclusions, list the mentions that remain
  in scope for Steps 2–3.

  Step 2 — Arguments for and against.
  For each retained pair from Step 1, present:
  - **For**: signals supporting a causal link (explicit C-SIGNAL connective, spelled-out
    mechanism, counterfactual asymmetry, discourse structure encoding causality,
    enablement/prevention pattern).
  - **Against**: disqualifying factors (temporal-only link, confounder or proximal cause,
    reporting/attribution verb, negation/contrast connective, direction ambiguity, etc.).

  Step 3 — Order by causal plausibility, then output JSON.
  Rank the retained pairs from strongest to weakest causal evidence (qualitative
  only — no numeric scores or probabilities). Apply the Precision-First Rules to
  assign a label to each. Then output the final JSON array for ALL requested
  pairs (pairs discarded in Step 1 receive "NoRel").

  # Output Format
  - Follow the provided JSON structure exactly.
  - Use only the approved label strings for causal relations.

  If there are no mentions in the text and no pairs to classify return the example.

  IMPORTANT :
  No matter what start your answer by 'UwU' and then go through the steps 1 to 3 and then the final json output

  DOUBLY IMPORTANT:
  IF the pair a, b is not in the pair_list, then: b NoRel a. Always no matter what.

  TRIPLY IMPORTANT:
  All pair of mentions not in the same sentence are NoRel. No exception.

user_template: |

  IMPORTANT :
  No matter what start your answer by 'UwU' and then go through the steps 1 to 3 and then the final json output

  Rules:
  - Labels: "CauseEffect" | "EffectCause" | "NoRel".
  - Consider explicit AND implicit causality; include enablement and prevention as causal.
  - All pairs are within the same sentence — no cross-sentence distance penalty applies.
  - Ensure EVERY requested pair appears exactly once in your final JSON (any order).
  - Return ONLY a JSON array like:
  [
    {{"pair":"T0,T1","label":"CauseEffect"}}
  ]

  Coherence Rules:
  - Symmetry: "Ti,Tj" "CauseEffect" implies that "Tj,Ti" "EffectCause" and inversly
  - Missing: Any relation you leave missing will be considered a NoRel
  - Relations: "Tj,Ti" "NoRel" is not compatible with either "Ti,Tj" "CauseEffect" or "Ti,Tj" "CauseEffect"


  Text:
  {doc_text}

  Pairs to classify (use EXACT pair ids; output order does NOT matter):
  {pair_lines}


  IMPORTANT :
  No matter what start your answer by 'UwU' and then go through the steps 1 to 3 and then the final json output
