system: |
  # Context
  The Event StoryLine Corpus (ESC) annotates "Explanatory Structure" (PLOT_LINKs) between event mentions in news articles. Relations capture the narrative causal backbone of a story — enabling conditions, direct causes, and their consequences. Only "semantically full" events are linked (Occurrences, States, Perceptions); attribution/reporting verbs ("said", "announced", "claimed") are almost never valid heads or tails.

  ## Label Set (Use these exact strings)
  - **"PRECONDITION"**: The Head event is a necessary enabler or cause of the Tail event (Head → enables/causes → Tail). The Tail could not have happened, or would not make sense, without the Head.
  - **"FALLING_ACTION"**: The Head event is a result, reaction, or consequence of the Tail event (Head ← caused by ← Tail). Head is the "step down" from Tail.
  - **"NoRel"**: No justified explanatory link. Default when evidence is weak, speculative, or purely world-knowledge.

  # Precision-First Rules (Apply Silently)
  1. **Textual Evidence Required:** The link must be grounded in the document, not assumed from world knowledge. Ask: "Would someone unfamiliar with this topic see this relation from the text alone?" If NO → **NoRel**.

  2. **Reporting/Attribution Gate:** If either event is a reporting verb ("said", "told", "announced", "claimed"), label **NoRel** unless the speech act itself physically enables or prevents the other event.

  3. **"Why" Test:** Ask "Does the text answer 'Why did Tj happen?' by pointing to Ti?" If yes → candidate for PRECONDITION(Ti, Tj). Ask "Is Ti described as a result of Tj?" If yes → candidate for FALLING_ACTION(Ti, Tj). If neither → **NoRel**.

  4. **World-Knowledge Check:** If you can only justify the link using general domain knowledge (not the specific sentences in the document) → **NoRel**.

  5. **Nearest Cause Preference:** If a more proximate event better explains Tj, label the current pair **NoRel**; do not skip over the direct cause.

  6. **Default to NoRel when Uncertain:** Ambiguous, underspecified, or equally plausible links → **NoRel**. Precision over recall.

  # Output Format
  - Return a JSON array. 
  - Use only the approved label strings.

user_template: |
  Rules:
  - Labels: "PRECONDITION" | "FALLING_ACTION". All pairs are potentially positive — only output pairs with a confirmed relation; any pair you omit is treated as NoRel.
  - Annotate both explicit links (marked by "because", "due to", "sparking", "leading to") and implicit links clearly supported by the narrative.
  - Ignore attribution/reporting events as causal heads or tails.
  - Return ONLY a JSON array like:
  [
    {{"pair":"a1,a2","label":"PRECONDITION"}}
  ]

  Coherence Rules:
  - Missing: Any pair you leave out will be treated as NoRel.

  Text:
  {doc_text}

  {pair_lines}

user_suffix: |
  Before outputting the JSON, reason step by step: first select the mention pairs that have any chance of being in a relation (filtering out obvious NoRel pairs), then for each candidate pair decide the label.
