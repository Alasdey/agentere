# queue1.yaml — one-factor-at-a-time sweep over maven_ere / event_story_line / causal_timebank
#
# Baseline (= your template block): deepseek-v4-flash, tools off, resampling on with
# n_runs 3 + distinct_fewshots, few-shot on with n_examples 3 / selection random,
# cot_generation enabled + blind + rewrite.
#
# Each experiment changes the baseline in EXACTLY ONE parameter, so every variant pairs
# with the dataset's `*_base` run in scripts/analysis/list_ablations.py:
#   n_examples : 1, 5, 7          (baseline 3)
#   n_runs     : 5, 7             (baseline 3)
#   selection  : bert, mentions, similarity   (baseline random)
# 9 runs x 3 datasets = 27 experiments, ordered cheapest dataset first
# (causal_timebank 183 -> event_story_line 233 -> maven_ere 710).
#
# The shared block lives in `_defaults` below and is pulled into every entry with the
# YAML merge key `<<:`; a variant re-merges only the sub-block it touches. run_queue.py
# reads `experiments` only, so `_defaults` is inert.
#
#   uv run python run_queue.py --queue queue1.yaml
#   uv run python run_queue.py --queue queue1.yaml --only ctb_base ctb_fs1 ctb_fs5 ctb_fs7

_defaults:
  model: &model
    default_model_id: "deepseek/deepseek-v4-flash"

  tools_config: &tools_config
    eci_extractor:
      model_id: "deepseek/deepseek-v3.2"
      concurrency: 10

  resampling: &resampling
    enabled: true
    distinct_fewshots: true
    n_runs: 3

  experiment: &experiment
    tools:
      - "coherence"
      # - "counterfactual_check"
      # - "eci_extractor"
      # - "eci_extractor_intra"
    enable_tools: false
    resampling: *resampling
    retries: 3

  cot_generation: &cot_generation
    enabled: true
    blind: true
    rewrite: true

  few_shot: &few_shot
    enabled: true
    n_examples: 3
    pool_size: 100
    # "random" "similarity" "mentions" "bert" "smallest"
    selection: "random"
    density_stratify: false
    intra_only: false
    cot_generation: *cot_generation

  data: &data
    binary_undirected: false       # global: collapse causes/causedby → CAUSAL and deduplicate pairs at load time
    vote_to_binary: false          # post-hoc: recombine directed causes/causedby vote_counts into a binary
    binary_default: "norel"
    novote_norel: true

  datasets: &datasets
    maven_ere:
      max_examples: 710 # 710
      prompt: "maven_ere_standard_eci_intra_lean"
    causal_timebank:
      max_examples: 183 # 183
      prompt: "causal_timebank_syntax"
    event_story_line:
      max_examples: 233 # 233
      prompt: "esl_standard_eci_intra_lean"

  base: &base
    model: *model
    tools_config: *tools_config
    experiment: *experiment
    few_shot: *few_shot
    data: *data
    datasets: *datasets


experiments:

  # ─────────────────────────── causal_timebank (183) ───────────────────────────

  - name: "ctb_fs1"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        n_examples: 1

  - name: "ctb_fs5"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        n_examples: 5


  - name: "ctb_res5"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 5


  - name: "ctb_sel_bert"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        selection: "bert"


  - name: "ctb_sel_similarity"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        selection: "similarity"

  # ────────────────────────── event_story_line (233) ───────────────────────────

  - name: "esl_fs1"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        n_examples: 1

  - name: "esl_fs5"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        n_examples: 5

  - name: "esl_res5"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 5

  - name: "esl_sel_bert"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        selection: "bert"

  - name: "esl_sel_similarity"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        selection: "similarity"

  # ───────────────────────────── maven_ere (710) ───────────────────────────────

  - name: "maven_fs1"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        n_examples: 1

  - name: "maven_fs5"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        n_examples: 5

  - name: "maven_res5"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 5

  - name: "maven_sel_bert"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        selection: "bert"

  - name: "maven_sel_similarity"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        selection: "similarity"
  
  # ───────────────────────────── Extras ───────────────────────────────
  
  - name: "ctb_fs7"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        n_examples: 7

  - name: "esl_fs7"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        n_examples: 7

  - name: "maven_fs7"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        n_examples: 7

  - name: "ctb_res7"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 7

  - name: "esl_res7"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 7
  
  - name: "maven_res7"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      experiment:
        <<: *experiment
        resampling:
          <<: *resampling
          n_runs: 7

  - name: "ctb_sel_mentions"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"
      few_shot:
        <<: *few_shot
        selection: "mentions"

  - name: "esl_sel_mentions"
    overrides:
      <<: *base
      active_dataset: "event_story_line"
      few_shot:
        <<: *few_shot
        selection: "mentions"
  
  - name: "maven_sel_mentions"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
      few_shot:
        <<: *few_shot
        selection: "mentions"
  
  - name: "maven_base"
    overrides:
      <<: *base
      active_dataset: "maven_ere"
  
  - name: "ctb_base"
    overrides:
      <<: *base
      active_dataset: "causal_timebank"

  - name: "esl_base"
    overrides:
      <<: *base
      active_dataset: "event_story_line"