# queue.yaml
# Each entry is a set of overrides deep-merged on top of config.yaml.
# Only keys that differ from config.yaml need to appear.
# active_dataset: "maven_ere"
# active_dataset: "event_story_line"
# active_dataset: "meci"
# active_dataset: "causal_timebank"

experiments:


  - name: "h"
    overrides:
      model:
          # default_model_id: "openai/gpt-5.5"
          # default_model_id: "google/gemini-1.5-pro"
          # default_model_id: "google/gemini-3.1-flash-lite"
          # default_model_id: "google/gemini-2.5-flash-lite"
          # default_model_id: "z-ai/glm-5.2"
          # default_model_id: "qwen/qwen3-30b-a3b-thinking-2507"
          # default_model_id: "openai/gpt-4o-mini" # Nope
          # default_model_id: "deepseek/deepseek-v3.2"
          default_model_id: "deepseek/deepseek-v4-pro"
          # default_model_id: "Qwen/Qwen3-Next-80B-A3B-Instruct"
      tools_config:
        eci_extractor:
          model_id: "deepseek/deepseek-v3.2"
          concurrency: 10
      active_dataset: "maven_ere"
      experiment:
        tools:
          - "coherence"
          # - "counterfactual_check"
          # - "eci_extractor"
          # - "eci_extractor_intra"
        enable_tools: false
        resampling:
          enabled: false
          n_runs: 3
        retries: 3
      few_shot:
        enabled: true
        pool_size: 3
        cot_generation:
          enabled: true
          num_steps: 3
      data:
        binary_undirected: false      # global: collapse causes/causedby → CAUSAL and deduplicate pairs at load time
        vote_to_binary: false          # post-hoc: recombine directed causes/causedby vote_counts into a binary
        binary_default: "norel" 
        novote_norel: true
      datasets:
        maven_ere:
          max_examples: 50
          # prompt: "maven_ere_standard_eci_intra_tool"
          # prompt: "common_eci_extractor_tool"
          prompt: "maven_ere_standard_eci_intra"
          # prompt: "maven_ere_standard_eci_norule_coref"
        meci:
          max_examples: 50
          # prompt: "meci_standard_eci_binary"
          prompt: "meci_standard_eci"
          # prompt: "meci_standard_eci_tools"
        causal_timebank:
          prompt: "causal_timebank_explicit_marker"
        event_story_line:
          max_examples: 50
          # prompt: "common_eci_extractor_tool"