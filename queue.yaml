  - name: "h"
    overrides:
      model:
          # default_model_id: "z-ai/glm-5.2"
          # default_model_id: "qwen/qwen3-30b-a3b-thinking-2507:nitro"
          default_model_id: "deepseek/deepseek-v3.2:nitro"
      active_dataset: "event_story_line"
      experiment:
        tools:
          # - "coherence" 
          # - "counterfactual_check"
          - "eci_extractor"
        enable_tools: true
        resampling:
          enabled: false
          n_runs: 3
        retries: 3
      few_shot:
        enabled: false
        pool_size: 3
        cot_generation:
          enabled: false
      data:
        binary_undirected: false
      datasets:
        maven_ere:
          max_examples: 50
          # prompt: "common_eci_extractor_tool"
        meci:
          max_examples: 50
          # prompt: "meci_standard_eci"
          # prompt: "meci_standard_eci_tools"
        causal_timebank:
          prompt: "causal_timebank_explicit_marker"
        event_story_line:
          max_examples: 10
          prompt: "common_eci_extractor_tool"

