# queue.yaml
# Each entry is a set of overrides deep-merged on top of config.yaml.
# Only keys that differ from config.yaml need to appear.

experiments:

  - name: "qwen-meci-full"
    overrides:
      model:
        default_model_id: "qwen/qwen3.6-35b-a3b:nitro"
      active_dataset: "meci"
      experiment:
        tracing_name: "qwen-meci-full"
        resampling:
          enabled: true
          n_runs: 3
      datasets:
        meci:
          max_examples: 716

  - name: "deepseek-maven-full"
    overrides:
      model:
        default_model_id: "deepseek/deepseek-v3.2"
      active_dataset: "maven_ere"
      experiment:
        tracing_name: "deepseek-maven-full"
        resampling:
          enabled: true
          n_runs: 3
      datasets:
        maven_ere:
          max_examples: 710

  - name: "qwen-esl-full"
    overrides:
      model:
        default_model_id: "qwen/qwen3.6-35b-a3b:nitro"
      active_dataset: "event_story_line"
      experiment:
        tracing_name: "qwen-esl-full"
        resampling:
          enabled: true
          n_runs: 3
      datasets:
        event_story_line:
          max_examples: 233
