[project]
name = "agentere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "graphviz>=0.21",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "mlflow>=3.11.1",
    "openpyxl>=3.1.5",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8",
    "en-core-web-sm",
    "da-core-news-sm",
    "es-core-news-sm",
    "tabulate>=0.10.0",
    "torch>=2.0.0",
]

# The three spaCy pipelines utils/syntax.py loads (see config.yaml `syntax:`). They are
# declared as real dependencies rather than installed with `spacy download`, because
# `uv run` prunes anything outside the synced dependency set — a downloaded model would be
# silently removed by the next `uv run python main.py`.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
da-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/da_core_news_sm-3.8.0/da_core_news_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
