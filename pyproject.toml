[project]
name = "agentere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "graphviz>=0.21",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "mlflow>=3.11.1",
    "openpyxl>=3.1.5",
    "sentence-transformers>=5.4.1",
    "spacy>=3.8",
    "en-core-web-sm",
    "tabulate>=0.10.0",
    "torch>=2.0.0",
]

# The spaCy pipeline utils/syntax.py loads (see config.yaml `syntax:`). Declared as a real
# dependency rather than installed with `spacy download`, because `uv run` prunes anything
# outside the synced dependency set — a downloaded model would be silently removed by the
# next `uv run python main.py`. English only: the syntax feature annotates English
# documents and skips every other language (see utils/syntax.py).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
