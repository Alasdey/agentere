# config.yaml


# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  default_model_id: "deepseek/deepseek-v3.2"
  # default_model_id: "z-ai/glm-5"
  # default_model_id: "deepseek/deepseek-r1-0528"
  # default_model_id: "openai/gpt-5-mini"
  # default_model_id: "mistralai/ministral-3b-2512"
  # default_model_id: "mistralai/mistral-small-3.2-24b-instruct"
  # default_model_id: "moonshotai/kimi-k2.5"
  # default_model_id: "nvidia/nemotron-3-nano-30b-a3b"
  # default_model_id: "arcee-ai/trinity-large-preview:free"
  # default_model_id: "openai/chatgpt-4o-latest"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.0

# =============================================================================
# GENERAL EXPERIMENT SETTINGS
# =============================================================================
experiment:
  tracing: "true"
  tracing_name: "DeepseekV3.2-meci-714-test-notools"
  # tracing_name: "gpt5mini-mavenere-100-resample3"
  # tracing_name: "gpt5mini-MECI-714"
  # tracing_name: "Mistral-MECI-714-6"
  # tracing_name: "Autoprompt-meci-deepseek"
  # tracing_name: "2-Deepseekv3.2-coherence-encoder-714"
  enable_tools: false
  tools: 
    - "coherence_check"
    # - "counterfactual_check"
    - "encoder_predictions"
    # - "bare_causes"
    # - "eci"
  concurrency: 100
  retries: 5          # How many times to retry a failed sample
  resampling:
    enabled: false
    n_runs: 3          # Votes per document
    tie_breaking: "norel"

# =============================================================================
# ACTIVE RUN CONFIGURATION
# =============================================================================
# Set this to the key of the dataset you want to evaluate.
active_dataset: "maven_ere"
# active_dataset: "event_story_line"
# active_dataset: "meci"

# =============================================================================
# DATASETS
# Definitions of datasets and their specific parameters.
# =============================================================================
datasets:
  maven_ere:
    name: "MAVEN-ERE-Causal"
    repo_id: "Nofing/MAVEN-ERE-Causal-Events"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    prompt: "maven_ere_1"
    # prompt: "maven_ere_all_tools"
    # prompt: "maven_ere_dr_eci_full"
    # prompt: "maven_ere_strict"
    rule_set: "maven-ere" 
    # max_examples: 5
    max_examples: 714
    labels: 
      - "CAUSE"
      - "PRECONDITION"
      - "NoRel"

  meci:
    name: "MECI-v0.1"
    repo_id: "Nofing/MECI-v0.1-public-span"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "meci"
    prompt: "meci_orig"
    # prompt: "meci_autoprompt_mistral"
    # prompt: "medi_autoprompt_deepseek"
    # prompt: "meci_autoprompt_deepseek_30"
    # prompt: "meci_autoprompt_deepseek_tools"
    # max_examples: 714
    max_examples: 50
    labels: 
      - "CauseEffect"
      - "EffectCause"
      - "NoRel"


  event_story_line:
    name: "EventStoryLine-1.5"
    repo_id: "Nofing/EventStoryLine-1.5-Causal"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "esl"
    prompt: "event_story_line_v2"
    max_examples: 50
    labels: 
      - "PRECONDITION"
      - "FALLING_ACTION"
      - "NoRel"


# ── Encoder baseline predictions (used by the encoder_predictions tool) ──
encoder_predictions:
  # path: "encoder_baseline/logs/EventStoryLine-1.5-Causal_test_2026_02_13_09_32_58/predictions.json"
  path: "encoder_baseline/logs/MAVEN-ERE-Causal-Events_test_2026_02_12_14_51_27/predictions.json"
  filter_norel:
    enabled: true
    delta: 0.10   # keep NoRel pairs only when max relation prob ≥ threshold − delta

# =============================================================================
# Promtps
# =============================================================================

prompts:
  maven_ere_1:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with extracting **Causal Relations** between events.
      Your goal is to identify "CAUSE" and "PRECONDITION" relations among ALL possible event pairs in the text.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # Label Definitions (Strict Adherence to MAVEN-ERE Guidelines)
      You must use the following definitions derived from the MAVEN-ERE annotation scheme:

      1. **CAUSE**: 
         - The tail event (ej) is **inevitable** given the head event (ei).
         - This represents strong, direct causality.
         - Example: "The earthquake (ei) caused the building to collapse (ej)."

      2. **PRECONDITION**: 
         - The tail event (ej) **would not have happened** if the head event (ei) **had not happened**.
         - This represents a necessary condition (enabling), but ej is not necessarily inevitable just because ei happened.
         - Example: "Buying a ticket (ei) was a precondition for entering the theater (ej)."

      # Instructions
      First call the encoder_predictions then analyse the results from that using coherence_check.
      Follow the instruction by reasoning on the text and the relations, explore and rationalize.
      Then output the results in json format
      1. **Scope**: Examine **all** possible pairs of event mentions in the document.
      2. **Directionality**: Relations are directional. "ei CAUSE ej" does not imply "ej CAUSE ei".
      3. **Sparsity**: Return **only** the positive relations (CAUSE or PRECONDITION). Do not output "NoRel" pairs in the JSON.
      4. **Implicit Causality**: Look for causal links that are not explicitly stated with markers like "because" or "due to", relying on semantic necessity (PRECONDITION) or inevitability (CAUSE).
      5. **Transitivity (Logic Consistency)**:
         - If A CAUSE B and B CAUSE C, then A CAUSE C.
         - If A CAUSE B and B PRECONDITION C, then A PRECONDITION C.
         - If A PRECONDITION B and B PRECONDITION C, then A PRECONDITION C.
         *Ensure your extraction respects these logical chains.*
      6. **Negative Events**: Events describing things that did not happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").

    user_template: |
      Task: Extract causal relations from the text below.
      
      Rules:
      - Identify relations among ALL pairs.
      - Labels: "CAUSE" | "PRECONDITION".
      - Output ONLY a JSON array of objects with "pair" and "label".
      - Pair format must be "ei,ej" (e.g., "e0,e1").
      - Do not include "NoRel" pairs.
      - Ensure consistency with transitivity rules.

      Output format example:
      [
        {{"pair": "e0,e1", "label": "CAUSE"}},
        {{"pair": "e5,e2", "label": "PRECONDITION"}}
      ]

      Use the coherence check tool

      Constraint: Return your reasoning and then ONLY the JSON array. Do not use '//' commentary

      Text:
      {doc_text}
      
      Pairs: all of them
      {pair_lines}

  maven_ere_all_tools:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with extracting **Causal Relations** between events.
      Your goal is to identify "CAUSE" and "PRECONDITION" relations among ALL possible event pairs in the text.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # CRITICAL: Precision Over Recall
      **You must strongly favor PRECISION over recall.**
      - It is FAR WORSE to predict a causal relation that does not exist than to miss one that does.
      - When in doubt, do NOT include the pair. Silence (NoRel) is always safer than a wrong label.
      - Only output a relation when you have strong, concrete textual evidence for it.
      - Vague, speculative, or common-sense-only links should be omitted.
      - A short, high-confidence list is always preferred over a long, uncertain one.

      # Label Definitions (Strict Adherence to MAVEN-ERE Guidelines)
      You must use the following definitions derived from the MAVEN-ERE annotation scheme.
      Apply them conservatively — if the evidence does not clearly satisfy the definition, do NOT label.

      1. **CAUSE**:
        - The tail event (ej) is **inevitable** given the head event (ei).
        - This represents strong, direct causality.
        - The inevitability must be grounded in the text, not assumed from world knowledge.
        - Example: "The earthquake (ei) caused the building to collapse (ej)."

      2. **PRECONDITION**:
        - The tail event (ej) **would not have happened** if the head event (ei) **had not happened**.
        - This represents a necessary condition (enabling), but ej is not necessarily inevitable just because ei happened.
        - The necessity must be clearly supported by the document, not merely plausible.
        - Example: "Buying a ticket (ei) was a precondition for entering the theater (ej)."

      # Guiding Principles (apply at every phase)
      - **Scope**: Examine **all** possible pairs of event mentions in the document.
      - **Directionality**: Relations are directional. "ei CAUSE ej" does NOT imply "ej CAUSE ei".
      - **Sparsity**: Return **only** the positive relations (CAUSE or PRECONDITION). Do NOT output "NoRel" pairs in the JSON. When uncertain, omit the pair entirely.
      - **Implicit Causality**: You may identify causal links not explicitly marked with "because" or "due to", but ONLY when the semantic necessity (PRECONDITION) or inevitability (CAUSE) is strongly supported by the text. Do not guess.
      - **Negative Events**: Events describing things that did NOT happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").
      - **Transitivity (Logic Consistency)** — enforce these at every phase:
        - If A CAUSE B and B CAUSE C, then A CAUSE C.
        - If A CAUSE B and B PRECONDITION C, then A PRECONDITION C.
        - If A PRECONDITION B and B PRECONDITION C, then A PRECONDITION C.
        - However, do NOT use transitivity to introduce links whose individual premises you are not confident about. A weak A→B and a weak B→C should NOT produce A→C.

      No matter what in doubt prefer 'NoRel' as precision is always prefered to recall

      # ═══════════════════════════════════════════════════════════════
      #  MANDATORY WORKFLOW — Execute ALL phases in strict order
      # ═══════════════════════════════════════════════════════════════
      #
      #  You MUST follow the four phases below sequentially.
      #  Do NOT skip any phase. Do NOT jump to the final JSON output
      #  before completing every phase.
      #
      # ───────────────────────────────────────────────────────────────

      ## PHASE 1 — Your Own Initial Prediction
      Before calling any tool, read the document carefully and produce your
      OWN preliminary list of causal relations. Reason step by step:

        1a. List every event mention you can identify in the document.
        1b. For every plausible pair, ask:
            - "Is ej inevitable given ei?" → if yes AND you have clear textual evidence, label CAUSE.
            - "Would ej not have happened without ei?" → if yes AND you have clear textual evidence, label PRECONDITION.
            - Otherwise → NoRel (do not list it).
        1c. For each candidate pair, explicitly state the textual evidence
            that supports the relation. If you cannot point to specific
            words or sentences, DROP the pair.
        1d. Check transitivity across your preliminary predictions.
        1e. Write out your preliminary predictions explicitly as a numbered list
            of triples: (ei_id, LABEL, ej_id). Label this list "PHASE 1 PREDICTIONS".

      DO NOT output final JSON yet. Proceed to Phase 2.

      ## PHASE 2 — Gather Independent Evidence (MANDATORY tool call)
      You MUST call the following tool. No exceptions.

        Call **encoder_predictions** with the document ID shown in the prompt.
        This returns the predictions of a trained neural classifier
        with confidence scores for every candidate pair.
        Record every pair the encoder predicts as CAUSE or PRECONDITION,
        along with its confidence score.

        EXACT TOOL CALL — write this (replacing the doc ID with the real one):

          encoder_predictions(doc_id="causal-en_15_WSJ_4.ann")

      After the tool returns, compare the encoder's predictions against your
      Phase 1 predictions:
        - **Agreement**: Pairs where both you and the encoder agree on a
          positive label gain higher confidence — keep them.
        - **Encoder-only positives**: Pairs the encoder predicts as causal
          but you did not. Re-examine the text. Only add them to your list
          if you find clear textual evidence you initially missed.
          If the evidence is weak or absent, do NOT add them.
        - **Your-only positives**: Pairs you predicted as causal but the
          encoder did not. Re-examine critically. If the encoder (a trained
          classifier) sees no causal link, treat this as a warning signal.
          Keep only if your textual evidence is unambiguous.

      Write out your revised list as "PHASE 2 REVISED PREDICTIONS".
      For each pair, note: [AGREED], [ADDED], or [KEPT DESPITE ENCODER].

      DO NOT output final JSON yet. Proceed to Phase 3.

      ## PHASE 3 — Coherence Refinement (MANDATORY tool call)
      Now check your predictions for logical consistency.

        Call **coherence_check** with your current best list of predictions.

        EXACT TOOL CALL — write this (with your actual predictions):

          coherence_check(pairs=[{"pair": "T1,T3", "label": "CAUSE"}, {"pair": "T3,T5", "label": "PRECONDITION"}])

        3a. Review every violation the tool reports:
            - If a violation reveals a missing transitive link AND both
              premises are high-confidence → add the transitive link.
            - If a violation reveals a missing transitive link but one or
              both premises are uncertain → reconsider whether a premise
              should be REMOVED rather than adding a new uncertain link.
              Precision first: removing a weak premise is preferred over
              adding an unsupported transitive conclusion.
            - If a violation reveals a contradictory label → resolve it
              by re-examining the text evidence. Drop the weaker relation.

        3b. After incorporating the results, check: are there NEW violations?
            - If YES → call coherence_check again with the updated list.
            - If NO → you have converged. Proceed to Phase 4.

      You MUST run at least ONE call to coherence_check.
      Call the coherence tool up to three time

      ## PHASE 4 — Final Output
      Only after completing ALL previous phases, produce your final answer.

      Before writing the JSON, perform one final precision review:
        - For EACH pair in your list, re-read the relevant sentence(s).
        - Ask: "Am I confident this relation is correct, or am I hedging?"
        - If hedging → REMOVE the pair. It is better to miss a relation
          than to output a wrong one.

      Summarize briefly:
        - How many pairs you started with (Phase 1) vs. how many survived.
        - Which pairs were removed and why.
        - How the encoder evidence changed your predictions.
        - Any transitive links that were added during refinement.

      Then output the final predictions as a JSON array. Output ONLY the JSON
      array — no markdown fences, no commentary after it.

      Format:
      [
        {"pair": "ei_id,ej_id", "label": "CAUSE"},
        {"pair": "ei_id,ej_id", "label": "PRECONDITION"},
        ...
      ]

      Rules for the final JSON:
      - Include ONLY pairs with a positive relation (CAUSE or PRECONDITION).
      - Pairs not listed are implicitly NoRel.
      - "pair" is always "source_id,target_id" (head,tail) — direction matters.
      - Every transitive closure required by the transitivity rules above
        MUST be present in the output — but only when both premises are confident.
      - When in doubt, OMIT. Precision is paramount.
        user_template: |
          Task: Extract causal relations (CAUSE, PRECONDITION) from the text.

          Input Text:
          {doc_text}

          Instructions:
          1. Briefly analyze the timeline and logical flow.
          2. For every potential pair, apply the **Counterfactual Test**:
            - "If Head had not happened, would Tail still have happened?" -> If YES, it is NoRel.
          3. Discard weak links where the relation is only temporal.
          4. Output ONLY the JSON array containing the strictly positive pairs.

          Output Format:
          [
            {{"pair": "e1,e2", "label": "CAUSE"}},
            {{"pair": "e3,e4", "label": "PRECONDITION"}}
          ]
          
          Output logic and then the JSON Do not use '//' commentary
  
    user_template: |
      Task: Extract causal relations (CAUSE, PRECONDITION) from the text.

      Input Text:
      {doc_text}

      Instructions:
      1. Briefly analyze the timeline and logical flow.
      2. For every potential pair, apply the **Counterfactual Test**:
         - "If Head had not happened, would Tail still have happened?" -> If YES, it is NoRel.
      3. Discard weak links where the relation is only temporal.
      4. Output ONLY the JSON array containing the strictly positive pairs.

      Output Format:
      [
        {{"pair": "e1,e2", "label": "CAUSE"}},
        {{"pair": "e3,e4", "label": "PRECONDITION"}}
      ]
      
      Output logic and then the JSON Do not use '//' commentary
  
  maven_ere_strict:
    system: |
      # Role
      You are a strict Causal Relation Adjudicator for the MAVEN-ERE dataset. Your goal is to extract *only* high-certainty causal links between events.

      # Objective
      Identify pairs of events (Head, Tail) that satisfy the "But-for" test and MAVEN-ERE guidelines.
      You must filter out pairs that are merely temporally related or correlated.

      # Label Definitions (STRICT)
      1. **CAUSE** (Inevitability):
         - Definition: Given that the Head event occurred, the Tail event was **inevitable**.
         - Logic: Head triggers Tail.
         - *Example:* "The explosion (Head) caused the destruction (Tail)."

      2. **PRECONDITION** (Necessity):
         - Definition: The Tail event **would strictly not have happened** if the Head event had not occurred.
         - Logic: Head is a necessary enabler for Tail, but Head implies Tail is NOT inevitable (Tail requires Head + other factors).
         - *Example:* "Buying a ticket (Head) allowed him to enter the cinema (Tail)." (Buying doesn't force entering, but entering requires buying).

      # Precision Filters (READ CAREFULLY)
      To reduce false positives, apply these rejection rules:
      1. **Rejection by Sequence:** Just because A happened before B does NOT mean A caused B. If B could have happened without A, label as "NoRel".
      2. **Rejection by Transitivity:** If A causes B, and B causes C, prefer extracting the direct chains (A,B) and (B,C). Do not output the skip-chain (A,C) unless the text explicitly links them directly.
      3. **Rejection by Attribution:** If an event is "reported" or "said" (e.g., "The official announced the war"), the "saying" is usually NOT the cause of the "war".
      4. **Rejection by Coreference:** Do not link an event to a coreferent mention of itself.

      # Output Guidelines
      - Scope: Analyze all mention pairs.
      - Temporal Constraint: Head must be BEFORE or OVERLAP Tail. If Head acts after Tail, it is impossible (NoRel).
      - Output: A JSON array of objects.

    user_template: |
      Task: Extract causal relations (CAUSE, PRECONDITION) from the text.

      Input Text:
      {doc_text}

      Instructions:
      1. Briefly analyze the timeline and logical flow.
      2. For every potential pair, apply the **Counterfactual Test**:
         - "If Head had not happened, would Tail still have happened?" -> If YES, it is NoRel.
      3. Discard weak links where the relation is only temporal.
      4. Output ONLY the JSON array containing the strictly positive pairs.

      Output Format:
      [
        {{"pair": "e1,e2", "label": "CAUSE"}},
        {{"pair": "e3,e4", "label": "PRECONDITION"}}
      ]
      
      Output logic and then the JSON Do not use '//' commentary

  maven_ere_dr_eci_full:
    system: |
      # Role and Identity
      You are **Dr. ECI**, a specialized Multi-Agent reasoning system designed for Document-level Event Causality Identification (DECI). Your architecture consists of three distinct internal modules that must execute sequentially to extract high-precision causal relations from text:
      1. **The Causal Explorer**: To perceive global context and filter noise.
      2. **The Mediator Detector**: To bridge implicit gaps in long-distance relations.
      3. **The Causal Reasoner**: To apply counterfactual logic and structural verification.

      # Task Definition
      You are provided with a document and a set of Event Mentions (triggers). Your goal is to identify all directed **CAUSE** and **PRECONDITION** relations between these events.

      # THE DR. ECI METHODOLOGY (Step-by-Step Execution Rules)

      ## Phase 1: The Causal Explorer (Global Context Perception)
      - **Objective**: Construct a coherent event timeline and filter non-causal associations.
      - **Action**: Analyze the document structure. Identify "Main Events" (central to the narrative) vs. "Background Events".
      - **Constraint**: Events often co-occur without being causal. You must distinguish **Causality** from **Correlation** and **Temporal Sequence**.
      - **Rule**: If Event A happens *after* Event B, A cannot cause B (unless it is a cyclic process, which is rare). Use the timeline to prune impossible pairs immediately.

      ## Phase 2: The Mediator Detector (Implicit Reasoning)
      - **Objective**: Solve Long-Distance Dependencies (LDD) and Implicit Causality.
      - **Theory**: In documents, the link between Event A (start) and Event C (end) is often mediated by an unmentioned or intermediate Event B (A -> B -> C).
      - **Action**: For distant pairs, do not look just for explicit connectors (like "because"). instead, hypothesize a "Concept Bridge". Ask: "Is there a logical intermediate state that connects these two?"
      - **Logic**: If the path requires a leap of logic that the text does not support via context or world knowledge, reject it.

      ## Phase 3: The Causal Reasoner (Verification & Labeling)
      - **Objective**: Finalize the decision using the "Counterfactual Test" and "Structural Consistency".
      - **Test 1: The Counterfactual (But-For Test)**
        - Ask: "In the specific context of this story, if the Head Event (Ei) had NOT occurred, would the Tail Event (Ej) still have happened?"
        - If Ej would still happen -> **NoRel**.
        - If Ej would NOT happen -> Proceed to Labeling.
      
      - **Test 2: Transitivity & Structure**
        - Ensure your graph is Acyclic (unless a loop is explicitly described).
        - Enforce Transitivity: If you output (A, CAUSE, B) and (B, CAUSE, C), you implied (A, CAUSE, C). Ensure A is indeed a valid ancestor of C.

      # Label Definitions (Strict MAVEN-ERE Schema)
      1. **CAUSE (Inevitability)**: 
         - A strong, generative force. Given Ei, Ej is inevitable or practically certain.
         - *Key*: Ei actively triggers Ej.
         - *Example*: "The *explosion* (Ei) caused the *death* (Ej)."
      
      2. **PRECONDITION (Necessity/Enablement)**: 
         - A necessary state that enables Ej, but does not force it.
         - *Key*: Ei makes Ej possible. Without Ei, Ej is impossible.
         - *Example*: "Buying a *ticket* (Ei) allowed him to *enter* (Ej)." (Buying doesn't force entering, but entering is impossible without buying).

      # Output format
      You must produce a valid JSON array of objects. Each object represents a directed relation.
      - Pair format: "EventID_Source,EventID_Target"
      - Label options: "CAUSE", "PRECONDITION"
      - Do NOT output "NoRel" pairs; simply omit them.

    user_template: |
      # Input Data
      
      **Text**:
      {doc_text}

      # Execution Command
      
      Execute the Dr. ECI process on the text above. 
      
      1. **Internal Monologue (Reasoning Trace)**: 
         - Briefly list the main timeline.
         - Identify any complex long-distance pairs and check for mediators.
         - Apply the 'But-For' test to ambiguous pairs.
         - *Note*: This section helps you think, but keep it concise.

      2. **Final Logic Graph (JSON)**:
         - Generate the final JSON array based strictly on the relations that passed Phase 3.
         - Use the specific IDs provided in the text (e.g., "e0", "e1").
      
      **Constraint**: The JSON must be the final part of your response.

      Example Output Structure:
      [
        {{"pair": "e1,e3", "label": "CAUSE"}},
        {{"pair": "e4,e5", "label": "PRECONDITION"}}
      ]

      **Dr. ECI Analysis Start:**

  meci:
    system: |
      # Role and Objective
      You are a careful MECI annotator tasked with producing precise and reliable causal relation labels in multilingual Wikipedia data. Use available tools when they improve correctness.
      Begin with a concise checklist (3-7 bullets) of what you will do; keep items conceptual, not implementation-level.
      # Instructions
      - FOCUS ON PRECISION: Prefer "NoRel" unless evidence is strong and directional.
      - Events are trigger spans only; relations are **directional** and refer to cause/enablement/prevention.
      - Final answers **must** adhere to the requested JSON schema.

      # Context
      MECI (Multilingual Event Causality Identification) follows ACE-style event mentions and EventStoryLine causal guidelines. It addresses cause, enable, prevent, and covers both explicit and implicit causal links — even across sentences. Data is drawn from Wikipedia articles in EN/DA/ES/TR/UR, with possibly long-range links (10–50 tokens apart). [Reference: COLING’22 MECI paper.]

      ## Label Set (Use these exact strings)
      - **"CauseEffect"**: Ti causes/enables/leads to or prevents the absence of Tj (Ti → Tj).
      - **"EffectCause"**: Tj causes/enables/leads to or prevents the absence of Ti (Tj → Ti).
      - **"NoRel"**: No justified causal link (reject temporal-only, correlation-only, or vague plausibility).

      # Precision-First Rules (Apply Silently)
      1. **Two-Signal Rule** for any non-overt link (i.e., no clear connective like "because/so/therefore/lead to/due to"): require at least **two independent signals** among:
          - a. Counterfactual asymmetry (but-for)
          - b. A concrete **mechanism** in the text (not just world knowledge)
          - c. Strong discourse evidence (e.g., apposition/relative clause clearly encoding causality)
          - d. Local lexical patterns of enablement/prevention
        If fewer than two signals are present → **NoRel**.

      2. **Distance/Scope Gate:** For **inter-sentential** pairs OR pairs with long textual distance, raise the bar:
          - Must pass counterfactual AND include **either** an explicit cue **or** a spelled-out mechanism. Otherwise, label **NoRel**.
          - Treat long-range links conservatively (MECI data routinely has 10–50 tokens between casual events).

      3. **Default to NoRel when Uncertain:** If evidence is ambiguous, underspecified, or equally well explained by correlation, reporting, or chronology → **NoRel**.

      4. **Confounder & Chain Check:** If another event more directly explains Tj, label Ti,Tj as **NoRel**; do not “skip over” the proximal cause.

      5. **Reporting/Attribution is Not Causal:** Events like "said", "reported", "claimed" are not causes of the content unless the **content event** is enabled/prevented by the speech act itself.

      6. **Negation/Contrast is Not Causality:** Connectives such as "although", "however", or "despite" do not justify causal labels unless the rules above are explicitly/implicitly satisfied.

      7. **Direction Test:** Use counterfactuals to establish directionality. If neither direction is necessary, or both seem plausible, → **NoRel**.

      # Decision Checklist (Apply Silently — Stricter than Before)
      1. Does Ti materially change the likelihood or state of Tj **in the text** (not just world knowledge)?
      2. Is there **two-signal** support (or explicit cue + counterfactual for long-range links)?
      3. Reject temporal-only, correlation-only, reporting, and contrastive links.
      4. Keep scope within the window; prefer the **nearest, most specific** cause.
      5. If a more direct cause is present, label **NoRel** for the current pair.

      # Output Format
      - Follow the provided JSON structure exactly.
      - Use only the approved label strings for causal relations.
  
