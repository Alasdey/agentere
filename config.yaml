# config.yaml


# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  # default_model_id: "minimax/minimax-m2.5"
  # default_model_id: "z-ai/glm-5"
  # default_model_id: "moonshotai/kimi-k2.5"
  # default_model_id: "openai/chatgpt-4o-latest"
  # default_model_id: "openai/gpt-5-mini"
  # default_model_id: "deepseek/deepseek-r1-0528"
  default_model_id: "deepseek/deepseek-v3.2"
  # default_model_id: "mistralai/mistral-small-3.2-24b-instruct"
  # default_model_id: "mistralai/ministral-3b-2512"
  # default_model_id: "nvidia/nemotron-3-nano-30b-a3b"
  # default_model_id: "arcee-ai/trinity-large-preview:free"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.0

# =============================================================================
# GENERAL EXPERIMENT SETTINGS
# =============================================================================
experiment:
  tracing: "true"
  tracing_name: "DeepseekV32_meci_714_test_coh_count_2"
  # tracing_name: "Toto_2"
  # tracing_name: "Meven-ERE-Eci"
  # tracing_name: "gpt5mini-MECI-714"
  # tracing_name: "Mistral-MECI-714-6"
  # tracing_name: "Autoprompt-meci-deepseek"
  # tracing_name: "2-Deepseekv3.2-coherence-encoder-714"
  enable_tools: true
  tools: 
    - "coherence"
    - "counterfactual_check"
    # - "encoder"
    # - "bare_causes"
    # - "eci"
  concurrency: 100
  retries: 5          # How many times to retry a failed sample
  resampling:
    enabled: false
    n_runs: 3          # Votes per document
    tie_breaking: "norel"


# ── Encoder baseline predictions (used by the encoder tool) ──
encoder:
  # path: "encoder_baseline/logs/EventStoryLine-1.5-Causal_test_2026_02_13_09_32_58/predictions.json"
  path: "encoder_baseline/logs/MAVEN-ERE-Causal-Events_test_2026_02_12_14_51_27/predictions.json"
  filter_norel:
    enabled: true
    delta: 0.20   # keep NoRel pairs only when max relation prob ≥ threshold − delta

# =============================================================================
# ACTIVE RUN CONFIGURATION
# =============================================================================
# Set this to the key of the dataset you want to evaluate.
# active_dataset: "maven_ere"
# active_dataset: "event_story_line"
active_dataset: "meci"

# =============================================================================
# DATASETS
# Definitions of datasets and their specific parameters.
# =============================================================================
datasets:
  maven_ere:
    name: "MAVEN-ERE-Causal"
    repo_id: "Nofing/MAVEN-ERE-Causal-Events"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    # prompt: "maven_ere_1"
    # prompt: "maven_ere_enc_coh"
    # prompt: "maven_ere_enc_inc"
    prompt: "maven_ere_eci"
    rule_set: "maven-ere" 
    # max_examples: 714
    max_examples: 50
    labels: 
      - "CAUSE"
      - "PRECONDITION"
      - "NoRel"

  meci:
    name: "MECI-v0.1"
    repo_id: "Nofing/MECI-v0.1-public-span"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "meci"
    # prompt: "meci_orig"
    # prompt: "meci_autoprompt_mistral"
    # prompt: "medi_autoprompt_deepseek"
    prompt: "meci_autoprompt_deepseek_30"
    # prompt: "meci_autoprompt_deepseek_tools"
    max_examples: 714
    # max_examples: 50
    # max_examples: 5
    labels: 
      - "CauseEffect"
      - "EffectCause"
      - "NoRel"


  event_story_line:
    name: "EventStoryLine-1.5"
    repo_id: "Nofing/EventStoryLine-1.5-Causal"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "esl"
    # prompt: "event_story_line_v2"
    prompt: "event_story_line_coh_enc"
    max_examples: 50
    labels: 
      - "PRECONDITION"
      - "FALLING_ACTION"
      - "NoRel"

# =============================================================================
# Promtps
# =============================================================================

prompts:
  maven_ere_1:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with extracting **Causal Relations** between events.
      Your goal is to identify "CAUSE" and "PRECONDITION" relations among ALL possible event pairs in the text.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # Label Definitions (Strict Adherence to MAVEN-ERE Guidelines)
      You must use the following definitions derived from the MAVEN-ERE annotation scheme:

      1. **CAUSE**: 
         - The tail event (ej) is **inevitable** given the head event (ei).
         - This represents strong, direct causality.
         - Example: "The earthquake (ei) caused the building to collapse (ej)."

      2. **PRECONDITION**: 
         - The tail event (ej) **would not have happened** if the head event (ei) **had not happened**.
         - This represents a necessary condition (enabling), but ej is not necessarily inevitable just because ei happened.
         - Example: "Buying a ticket (ei) was a precondition for entering the theater (ej)."

      # Instructions
      First call the encoder then analyse the results from that using coherence.
      Follow the instruction by reasoning on the text and the relations, explore and rationalize.
      Then output the results in json format
      1. **Scope**: Examine **all** possible pairs of event mentions in the document.
      2. **Directionality**: Relations are directional. "ei CAUSE ej" does not imply "ej CAUSE ei".
      3. **Sparsity**: Return **only** the positive relations (CAUSE or PRECONDITION). Do not output "NoRel" pairs in the JSON.
      4. **Implicit Causality**: Look for causal links that are not explicitly stated with markers like "because" or "due to", relying on semantic necessity (PRECONDITION) or inevitability (CAUSE).
      5. **Transitivity (Logic Consistency)**:
         - If A CAUSE B and B CAUSE C, then A CAUSE C.
         - If A CAUSE B and B PRECONDITION C, then A PRECONDITION C.
         - If A PRECONDITION B and B PRECONDITION C, then A PRECONDITION C.
         *Ensure your extraction respects these logical chains.*
      6. **Negative Events**: Events describing things that did not happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").

    user_template: |
      Task: Extract causal relations from the text below.
      
      Rules:
      - Identify relations among ALL pairs.
      - Labels: "CAUSE" | "PRECONDITION".
      - Output ONLY a JSON array of objects with "pair" and "label".
      - Pair format must be "ei,ej" (e.g., "e0,e1").
      - Do not include "NoRel" pairs.
      - Ensure consistency with transitivity rules.

      Output format example:
      [
        {{"pair": "e0,e1", "label": "CAUSE"}},
        {{"pair": "e5,e2", "label": "PRECONDITION"}}
      ]

      Use the coherence check tool

      Constraint: Return your reasoning and then ONLY the JSON array. Do not use '//' commentary

      Text:
      {doc_text}
      
      Pairs: all of them
      {pair_lines}

  maven_ere_eci:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with identifying whether a **Causal Relation** exists between pairs of events.
      Your goal is to determine, for each event pair, whether ANY causal link (direct causation OR enabling precondition) holds between the two mentions — **regardless of direction**.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # Label Definition
      You must use a single label:

      1. **CAUSE**: 
         - A causal relation of **any kind** (strong/direct causation OR necessary precondition/enabling) exists between the two event mentions.
         - The relation may hold in **either direction** (ei → ej OR ej → ei). You do not need to determine which event is the cause and which is the effect.
         - Example (direct): "The earthquake (ei) caused the building to collapse (ej)." → ei,ej is CAUSE.
         - Example (precondition): "Buying a ticket (ei) was a precondition for entering the theater (ej)." → ei,ej is CAUSE.
         - Example (implicit): "After the dam broke (ei), the valley flooded (ej)." → ei,ej is CAUSE.

      # Instructions
      First call the encoder then analyse the results from that using coherence.
      Follow the instruction by reasoning on the text and the relations, explore and rationalize.
      Then output the results in json format.
      1. **Scope**: Examine **all** possible pairs of event mentions in the document.
      2. **Direction-Agnostic**: Since we only care about existence, the pair "ei,ej" covers both directions. Do **not** list both "ei,ej" and "ej,ei" — one entry per unordered pair is sufficient.
      3. **Sparsity**: Return **only** the positive relations (CAUSE). Do not output "NoRel" pairs in the JSON.
      4. **Implicit Causality**: Look for causal links that are not explicitly stated with markers like "because" or "due to", relying on semantic necessity or inevitability.
      5. **Negative Events**: Events describing things that did not happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").

    user_template: |
      Task: Extract causal relations from the text below.
      
      Rules:
      - Identify whether a causal relation EXISTS among ALL pairs.
      - Single label: "CAUSE" (any type of causation or precondition, either direction).
      - Output ONLY a JSON array of objects with "pair" and "label".
      - Pair format must be "ei,ej" where i < j (e.g., "e0,e1"). List each unordered pair at most once.
      - Do not include "NoRel" pairs.

      Output format example:
      [
        {{"pair": "e0,e1", "label": "CAUSE"}},
        {{"pair": "e2,e5", "label": "CAUSE"}}
      ]

      Use the coherence check tool

      Constraint: Return your reasoning and then ONLY the JSON array. Do not use '//' commentary

      Text:
      {doc_text}
      
      Pairs: all of them
      {pair_lines}

  maven_ere_enc_coh:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with extracting **Causal Relations** between events.
      Your goal is to identify "CAUSE" and "PRECONDITION" relations among ALL possible event pairs in the text.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # Label Definitions (Strict Adherence to MAVEN-ERE Guidelines)
      You must use the following definitions derived from the MAVEN-ERE annotation scheme.

      1. **CAUSE**:
        - The tail event (ej) is **inevitable** given the head event (ei).
        - This represents strong, direct causality.
        - The inevitability must be grounded in the text, not assumed from world knowledge.
        - Example: "The earthquake (ei) caused the building to collapse (ej)."

      2. **PRECONDITION**:
        - The tail event (ej) **would not have happened** if the head event (ei) **had not happened**.
        - This represents a necessary condition (enabling), but ej is not necessarily inevitable just because ei happened.
        - The necessity must be clearly supported by the document, not merely plausible.
        - Example: "Buying a ticket (ei) was a precondition for entering the theater (ej)."

      # Guiding Principles (apply at every phase)
      - **Scope**: Examine **all** possible pairs of event mentions in the document.
      - **Directionality**: Relations are directional. "ei CAUSE ej" does NOT imply "ej CAUSE ei".
      - **Sparsity**: Return **only** the positive relations (CAUSE or PRECONDITION). Do NOT output "NoRel" pairs in the JSON.
      - **Implicit Causality**: You may identify causal links not explicitly marked with "because" or "due to", but ONLY when the semantic necessity (PRECONDITION) or inevitability (CAUSE) is supported by the text.
      - **Negative Events**: Events describing things that did NOT happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").
      - **Transitivity (Logic Consistency)** — enforce these at every phase:
        - If A CAUSE B and B CAUSE C, then A CAUSE C.
        - If A CAUSE B and B PRECONDITION C, then A PRECONDITION C.
        - If A PRECONDITION B and B PRECONDITION C, then A PRECONDITION C.
      - **Balance**: When in doubt prefer 'NoRel'

      # ═══════════════════════════════════════════════════════════════
      #  MANDATORY WORKFLOW — Execute ALL phases in strict order
      # ═══════════════════════════════════════════════════════════════
      #
      #  You MUST follow the four phases below sequentially.
      #  Do NOT skip any phase. Do NOT jump to the final JSON output
      #  before completing every phase.
      #
      # ───────────────────────────────────────────────────────────────

      Do not use the "DSML" format for tool calling, use the OPENAI format

      ## PHASE 1 — Retrieve Encoder Predictions (MANDATORY tool call — do this FIRST)
      Before doing any of your own analysis, you MUST call the encoder tool to
      get the predictions of a trained neural classifier. The encoder is a
      fine-tuned model that has been trained specifically on this task and is
      highly reliable. Its predictions are your primary starting point.

        Call **encoder** (no arguments needed — the document context
        is provided automatically).

      Once you have the encoder's output:
        - Record every pair the encoder predicts as CAUSE or PRECONDITION,
          along with its confidence scores.
        - **Adopt all encoder predictions as your baseline.** The encoder is
          a strong, trained classifier — trust its positive predictions unless
          you find clear textual evidence that contradicts them.
        - Also note any pairs where the encoder is uncertain (i.e., the
          confidence for a causal label is close to the decision threshold).
          These are candidates where your own reading of the text may help.

      Write out the encoder's positive predictions as "PHASE 1 — ENCODER BASELINE".

      DO NOT output final JSON yet. Proceed to Phase 2.

      ## PHASE 2 — Your Own Supplementary Analysis
      Now read the document carefully and compare against the encoder baseline.
      Your role in this phase is to:

        2a. **Validate encoder predictions**: For each encoder-predicted pair,
            verify that the text supports the relation. If the encoder predicts
            a relation but you find **clear, unambiguous textual evidence** that
            it is wrong, you may remove it — but do so sparingly. The encoder
            is usually correct.

        2b. **Identify missed relations**: Look for causal pairs that the encoder
            may have missed. The encoder can have gaps, especially for:
            - Implicit causal links without explicit cue words
            - Long-distance relations spanning multiple sentences
            - Transitive relations that the encoder does not compute
            If you find a pair with solid textual evidence, add it.

        2c. **Check label accuracy**: If the encoder labeled something CAUSE
            but it is more accurately a PRECONDITION (or vice versa), correct
            the label with justification.

        2d. **Apply transitivity**: Check whether the combined set of predictions
            (encoder + your additions) requires transitive closure:
            - If A CAUSE B and B CAUSE C → add A CAUSE C if missing.
            - If A CAUSE B and B PRECONDITION C → add A PRECONDITION C if missing.
            - If A PRECONDITION B and B PRECONDITION C → add A PRECONDITION C if missing.
            Only add transitive links when both premises are confident.

      Write out your revised list as "PHASE 2 — REVISED PREDICTIONS".
      For each pair, note: [ENCODER], [ENCODER-CORRECTED], [ADDED], or [ENCODER-REMOVED] with a brief reason.

      DO NOT output final JSON yet. Proceed to Phase 3.

      ## PHASE 3 — Coherence Refinement (MANDATORY tool call)
      Now check your predictions for logical consistency.

        Call **coherence** with your current best list of predictions.

        3a. Review every violation the tool reports:
            - If a violation reveals a missing transitive link and both
              premises are confident → add the transitive link.
            - If a violation reveals a contradictory label → resolve it
              by re-examining the text evidence. Correct or drop the weaker relation.

        3b. After incorporating the results, check: are there NEW violations?
            - If YES → call coherence again with the updated list.
            - If NO → you have converged. Proceed to Phase 4.

      You MUST run at least ONE call to coherence.
      Call the coherence tool up to three times if needed.

      ## PHASE 4 — Final Output
      Only after completing ALL previous phases, produce your final answer.

      Before writing the JSON, perform one final review:
        - For EACH pair, confirm the label is correct and textually supported.
        - Ensure all required transitive closures are present.
        - Ensure no contradictions remain.

      Summarize briefly:
        - How many pairs came from the encoder vs. how many you added or removed.
        - Any transitive links that were added during refinement.
        - Any encoder predictions you overrode and why.

      Then output the final predictions as a JSON array. Output ONLY the JSON
      array — no markdown fences, no commentary after it.

      Format:
      [
        {"pair": "ei_id,ej_id", "label": "CAUSE"},
        {"pair": "ei_id,ej_id", "label": "PRECONDITION"},
        ...
      ]

      Rules for the final JSON:
      - Include ONLY pairs with a positive relation (CAUSE or PRECONDITION).
      - Pairs not listed are implicitly NoRel.
      - "pair" is always "source_id,target_id" (head,tail) — direction matters.
      - Every transitive closure required by the transitivity rules above
        MUST be present in the output.  
    
    user_template: |
      Task: Extract causal relations (CAUSE, PRECONDITION) from the text.

      Input Text:
      {doc_text}

      Output Format:
      [
        {{"pair": "e1,e2", "label": "CAUSE"}},
        {{"pair": "e3,e4", "label": "PRECONDITION"}}
      ]
      
      Output logic and then the JSON Do not use '//' commentary
  
  maven_ere_enc_inc:
    system: |
      # Role and Objective
      You are an expert annotator for the MAVEN-ERE dataset, tasked with extracting **Causal Relations** between events.
      Your goal is to identify "CAUSE" and "PRECONDITION" relations among ALL possible event pairs in the text.
      Only output the pairs that have a causal relation; unlisted pairs are implicitly "NoRel".

      # Label Definitions (Strict Adherence to MAVEN-ERE Guidelines)
      You must use the following definitions derived from the MAVEN-ERE annotation scheme:

      1. **CAUSE**: 
         - The tail event (ej) is **inevitable** given the head event (ei).
         - This represents strong, direct causality.
         - Example: "The earthquake (ei) caused the building to collapse (ej)."
         - **Not CAUSE**: Mere temporal sequence, correlation, topical relatedness, or loose influence do NOT qualify. If ej could plausibly have occurred even without ei, it is NOT a CAUSE.

      2. **PRECONDITION**: 
         - The tail event (ej) **would not have happened** if the head event (ei) **had not happened**.
         - This represents a necessary condition (enabling), but ej is not necessarily inevitable just because ei happened.
         - Example: "Buying a ticket (ei) was a precondition for entering the theater (ej)."
         - **Not PRECONDITION**: If ej could have happened through some other path without ei, then ei is NOT a precondition. Background context or thematic association alone do NOT qualify.

      # Asymmetry
      - Relations are strictly directional. "ei CAUSE ej" does **not** imply "ej CAUSE ei". Likewise for PRECONDITION.
      - CAUSE and PRECONDITION are **not interchangeable**. CAUSE requires inevitability; PRECONDITION requires strict necessity without inevitability. If both tests are met, use CAUSE.

      # Transitivity
      - The only transitivity rule to enforce: if A is a **PRECONDITION** for B, and B **CAUSES** C, then A is a **PRECONDITION** for C.
      - Do not apply any other transitive inference.

      # Recall Guidance — Do Not Under-Extract
      - **Cast a wide net first, then refine.** It is worse to miss a genuine causal relation than to tentatively include one that is debatable.
      - **Implicit and indirect causality counts.** Many causal relations in text are not signaled by explicit markers like "because" or "caused." Look actively for enabling conditions, background causes, and chains of events where one makes the next possible or inevitable.
      - **Consider all event pairs seriously.** Do not skip pairs just because they seem distant in the text or because the connection requires a step of reasoning.
      - **PRECONDITION is broad.** If an event establishes a state of affairs without which a later event could not have occurred in the way it did, that is a PRECONDITION — even if the text does not highlight the link.
      - **When the encoder flags a relation**, take it seriously. Only reject encoder predictions when you have a clear textual reason to do so, not out of general caution.

      # Common Over-Interpretation Errors to Still Avoid
      - **Temporal proximity ≠ causality**: Just because ei happens before ej does NOT mean ei caused or enabled ej.
      - **Topical relatedness ≠ causality**: Events that belong to the same story are NOT automatically causally linked.
      - **Narrative coherence ≠ causality**: Do not invent causal links with no textual basis just to make the story flow better.

      # Multi-Interpretation Procedure

      You must follow these steps in order:

      ## Step 0: Encoder Baseline
      **Before any reasoning**, call the `encoder` tool on the document and event pairs. This produces an initial set of predicted relations with confidence scores. Record these predictions — they serve as the **anchor and starting point** for all subsequent steps. Every interpretation you generate in the following steps must be grounded in and responsive to the encoder's output: you may agree with, refine, upgrade, downgrade, or reject individual encoder predictions, but you must explicitly engage with them. **Default to trusting the encoder unless the text clearly contradicts a prediction.**

      ## Step 1: Generate 5 Incompatible Causal Summaries
      Based on the encoder predictions and the text, produce **five distinct two-sentence summaries** of the main causal dependencies in the text. Each summary must represent a **meaningfully different causal interpretation** of the text — they should be **mutually incompatible** (i.e., they disagree on what causes what, which events are central drivers, or which direction the causality flows). Each summary should propose a different way of reading the encoder's predictions in context: some may accept certain high-confidence predictions and reject others; some may reinterpret borderline predictions differently. Importantly, **at least two of the five interpretations should be deliberately generous in identifying causal links**, erring on the side of inclusion. Push yourself to consider alternative, non-obvious, and even counterintuitive readings of the causal structure.

      ## Step 2: Generate 5 Full Self-Standing Causal Extractions in Natural Language
      For **each** of the 5 summaries above, produce a **complete, self-standing natural-language extraction** of ALL causal and precondition relations you would derive under that interpretation.

      **Critical requirements for each extraction:**
      - Each extraction must be **fully complete on its own** — it must cover every event pair you consider causally related under that interpretation, not just the pairs where it differs from other interpretations.
      - A reader should be able to understand any single extraction **without reading the other four**.
      - Do not write "same as Interpretation 1 except…" — enumerate every relation explicitly every time.
      - Write these out as numbered lists of English sentences (e.g., "Event X caused Event Y because…", "Event A was a precondition for Event B because…").
      - Each extraction must be **internally consistent** and represent a coherent causal reading of the text.
      - For each relation, note whether the encoder predicted it and with what confidence, and whether you are accepting, modifying, or overriding the encoder's judgment.
      - **Actively look for relations you might be missing.** After drafting each extraction, re-scan all event pairs to check if you overlooked any causal links under that interpretation.

      ## Step 3: Select the Best Interpretation
      Compare all 5 interpretations against the actual text and the encoder predictions. Choose the **single best interpretation** — the one that most faithfully and completely captures the causal structure expressed or implied in the text. Explain **why** this interpretation is superior to the other four, referencing specific textual evidence, the CAUSE vs. PRECONDITION definitions, and how it handles the encoder's predictions most appropriately. **Favor the interpretation that captures the most genuine relations without introducing clearly wrong ones**, rather than the most conservative one.

      ## Step 4: Sanity Check — Remove Only Clearly Wrong Relations
      Take your chosen interpretation and review each relation. The goal here is **not to aggressively prune** but to catch clear errors. For each relation, ask:

      **For CAUSE relations:**
      - "Is there a reasonable reading of the text where ej is inevitable given ei?" If yes → **KEEP IT**.
      - "Is this link based purely on temporal proximity or topical relatedness with zero causal logic?" If yes → **REMOVE IT**.

      **For PRECONDITION relations:**
      - "Is there a reasonable reading of the text where ej depends on ei having occurred?" If yes → **KEEP IT**.
      - "Is this link entirely fabricated with no textual support whatsoever?" If yes → **REMOVE IT**.

      **General check:**
      - "Did the encoder predict this relation?" If yes, you need a **clear, specific textual reason** to remove it — not just vague doubt.
      - "Did I miss any relations that the encoder flagged or that any of my other 4 interpretations included?" If a relation appeared in multiple interpretations or was encoder-predicted, reconsider adding it back.

      List each relation you are removing and state the specific reason. List each relation you are keeping. **Keep relations that are defensible, even if not beyond all doubt.**

      ## Step 5: Output the Final JSON
      Convert your surviving relations into the structured JSON output format specified below.

      # Extraction Rules (apply to the final output)
      1. **Scope**: Examine **all** possible pairs of event mentions in the document.
      2. **Directionality**: Relations are directional and asymmetric.
      3. **Sparsity**: Return **only** the positive relations (CAUSE or PRECONDITION). Do not output "NoRel" pairs in the JSON.
      4. **Implicit Causality**: Actively identify causal links not marked by explicit discourse markers. These are common and important for recall.
      5. **Negative Events**: Events describing things that did not happen can still participate in causal relations (e.g., "The failure to signal (ei) caused the crash (ej)").

    user_template: |
      Task: Extract causal relations from the text below using the multi-interpretation procedure.

      ## Procedure (follow ALL steps in order):

      ### Step 0 — Encoder Baseline
      Call the `encoder` tool on the document and event pairs. Record the predictions. These are your anchor — default to trusting them unless the text clearly says otherwise.

      ### Step 1 — Five Incompatible Causal Summaries
      Based on the encoder output and the text, write 5 two-sentence summaries of the main causal dependencies. Each must offer a **different and incompatible** causal reading. Each should propose a different way of interpreting or selectively trusting the encoder's predictions in context. At least two should be deliberately generous in identifying causal links.

      ### Step 2 — Five Complete Self-Standing Causal Extractions
      For each of the 5 summaries, write out the **complete list** of causal and precondition relations in plain English sentences. **Each extraction must be fully self-contained** — enumerate every relation from scratch each time. Do not abbreviate by referencing other interpretations. Every extraction must stand alone as a complete causal annotation of the text. For each relation, note how it relates to the encoder's prediction. After each extraction, re-scan all pairs to check for missed relations.

      ### Step 3 — Choose the Best Interpretation
      Select the single best interpretation. Explain why it is the most faithful to the text and encoder predictions, and why each of the other four is inferior. **Prefer completeness over excessive caution.**

      ### Step 4 — Sanity Check
      Review each relation in your chosen interpretation. Remove only those that are **clearly wrong** — based on zero causal logic or pure topical/temporal proximity. Reconsider any relation the encoder predicted or that appeared in multiple interpretations before removing it. **Keep defensible relations.**

      ### Step 5 — Final JSON Output
      Convert ONLY the surviving relations into a JSON array.

      Rules:
      - Labels: "CAUSE" | "PRECONDITION".
      - Output ONLY a JSON array of objects with "pair" and "label".
      - Pair format must be "ei,ej" (e.g., "e0,e1").
      - Do not include "NoRel" pairs.

      Output format example:
      [
        {{"pair": "e0,e1", "label": "CAUSE"}},
        {{"pair": "e5,e2", "label": "PRECONDITION"}}
      ]

      Constraint: Follow Steps 0–5 in order. After your full reasoning, end with ONLY the final JSON array. Do not use '//' commentary in the JSON.

      Text:
      {doc_text}
      
      Pairs: all of them
      {pair_lines}
    
    user_template: |
      Task: Extract causal relations from the text below using the multi-interpretation procedure.

      Rules:
      - Labels: "CAUSE" | "PRECONDITION".
      - Output ONLY a JSON array of objects with "pair" and "label".
      - Pair format must be "ei,ej" (e.g., "e0,e1").
      - Do not include "NoRel" pairs.
      - It is acceptable to return an empty array [] if no relations are indisputable.

