# =============================================================================
# GENERAL EXPERIMENT SETTINGS
# =============================================================================
mlflow:
  enabled: true
  tracking_uri: "mlruns"
  experiment_name: "agentere"

data:
  shuffle_pair_list: true         # randomise pair order within each document at load time
  reshuffle_per_resample: true   # re-randomise pair order independently for each resample run
  

experiment:
  tracing: "false"
  # tracing_name: "DeepseekV32_meci_714_test_coh_count_resamp"
  tracing_name: "Toto_2"
  # tracing_name: "Meven-ERE-Eci"
  # tracing_name: "gpt5mini-MECI-714"
  # tracing_name: "Mistral-MECI-714-6"
  # tracing_name: "Autoprompt-meci-deepseek"
  # tracing_name: "2-Deepseekv3.2-coherence-encoder-714"
  enable_tools: false
  tools:
    - "coherence"
    - "counterfactual_check"
    # - "encoder"
    # - "bare_causes"
    # - "eci"
    # - "reprompt"
  concurrency: 100
  retries: 3          # How many times to retry a failed sample
  timeout: 1200       # Seconds before a single inference attempt is cancelled and retried
  resampling:
    enabled: true
    n_runs: 5         # Votes per document
    tie_breaking: "norel"
  kfold:
    enabled: true
    n_folds: 10        # fold = doc_idx % n_folds (deterministic, no shuffle)


# ── Few-shot examples (used by the few_shot_examples tool) ──
few_shot:
  enabled: true
  split: "train"        # split to sample from (must exist in the active dataset's repo)
  n_examples: 1
  systematic: true      # true: auto-inject before LLM call; false: agent calls the tool
  selection: "smallest"   
                        # "random"     — resample every call for variance
                        # "similarity" — TF-IDF cosine against the current doc text (sklearn required)
                        # "mentions"   — Jaccard similarity on event mention text sets
                        # "bert"       — cosine similarity on sentence-transformer embeddings
                        # "smallest"   — Gets the doc with the smallest non negative pair_list (mostly for debuging)
  # bert_model: "all-MiniLM-L6-v2"  # used only when selection: "bert"
  bert_model: "all-roberta-large-v1"  # used only when selection: "bert"
  # repo_id: ~          # optional override; defaults to the active dataset's repo_id
  cot_generation:
    enabled: true      # true: generate realistic CoT few-shots via 2-step LLM call
    # cache_path: "logs/cot_cache.json"  # uncomment to persist generated CoTs across runs

# ── Reprompt tool ──
reprompt:
  systematic: false     # true: auto-inject reprompt just after few_shot; false: agent calls the tool

# ── Encoder baseline predictions (used by the encoder tool) ──
encoder:
  # path: "encoder_baseline/logs/EventStoryLine-1.5-Causal_test_2026_02_13_09_32_58/predictions.json"
  path: "encoder_baseline/logs/MAVEN-ERE-Causal-Events_test_2026_02_12_14_51_27/predictions.json"
  filter_norel:
    enabled: true
    delta: 0.20   # keep NoRel pairs only when max relation prob ≥ threshold − delta

# =============================================================================
# ACTIVE RUN CONFIGURATION
# =============================================================================
# Set this to the key of the dataset you want to evaluate.
# active_dataset: "maven_ere"
# active_dataset: "event_story_line"
# active_dataset: "meci"
# active_dataset: "causal_timebank"
active_dataset: "causal_timebank_standard"

# =============================================================================
# DATASETS
# Definitions of datasets and their specific parameters.
# =============================================================================
datasets:
  maven_ere:
    name: "MAVEN-ERE-Causal"
    repo_id: "Nofing/MAVEN-ERE-Causal-Events"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    prompt: "maven_ere_eci_bin"
    # prompt: "maven_ere_eci"
    # prompt: "maven_ere_1"
    # prompt: "maven_ere_enc_coh"
    # prompt: "maven_ere_enc_inc"
    rule_set: "maven-ere"
    # max_examples: 714
    max_examples: 50
    binary_undirected: true
    labels:
      - "CAUSAL"
      - "NoRel"
    sampling:
      enabled: false
      norel_ratio: 2.0   # n_norel_selected = floor(n_positive * norel_ratio)

  meci:
    name: "MECI-v0.1"
    # repo_id: "Nofing/MECI-v0.1-public-span"
    repo_id: "Nofing/MECI-v0.1-public-standard"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "meci"
    # prompt: "meci_orig_conv_eci"
    # prompt: "meci_orig_conv_bin"
    # prompt: "meci_orig"
    prompt: "meci_sort"
    # prompt: "meci_autoprompt_mistral"
    # prompt: "medi_autoprompt_deepseek"
    # prompt: "meci_autoprompt_deepseek_30"
    # max_examples: 714
    # max_examples: 50
    # max_examples: 10
    # max_examples: 5
    max_examples: 1
    binary_undirected: false
    labels:
      # - "CAUSAL"
      - "CauseEffect"
      - "EffectCause"
      - "NoRel"


  causal_timebank:
    name: "CausalTimeBank-ECI"
    repo_id: "Nofing/CausalTimeBank-causal"
    split: "train"          # no fixed split; all 183 docs in one split
    text_field: "text"
    ann_field: "annots"     # all intra-sentence pairs with CLINK / NoRel labels
    rule_set: "causal_timebank"
    # prompt: "causal_timebank_eci"
    # max_examples: 183
    max_examples: 50
    binary_undirected: true   # CLINK → CAUSAL; evaluate as unordered pairs
    labels:
      - "CAUSAL"
      - "NoRel"

  causal_timebank_standard:
    name: "CausalTimeBank-standard"
    repo_id: "Nofing/CausalTimeBank-standard"
    split: "train"
    text_field: "text"
    ann_field: "annots"
    rule_set: "meci"
    # prompt: "meci_orig"
    # prompt: "causal_timebank_sort"
    prompt: "meci_sort"
    # max_examples: 183
    max_examples: 20
    # max_examples: 1
    binary_undirected: false
    labels:
      - "CauseEffect"
      - "EffectCause"
      - "NoRel"

  event_story_line:
    name: "EventStoryLine-1.5"
    repo_id: "Nofing/EventStoryLine-1.5-Causal"
    split: "test"
    text_field: "text"
    ann_field: "annots"
    rule_set: "esl"
    prompt: "event_story_line_binary_cot"
    # prompt: "event_story_line_binary"
    # prompt: "event_story_line_eci"
    # prompt: "event_story_line_v2"
    # prompt: "event_story_line_coh_enc"
    # prompt: "esl_perpair"
    max_examples: 24
    binary_undirected: true
    labels:
      - "CAUSAL"
      - "NoRel"

# =============================================================================
# PROMPTS
# Prompt files live in prompts/<name>.yaml — loaded on demand by load_config().
# The active prompt is determined by datasets.<active_dataset>.prompt
# =============================================================================

# =============================================================================
# RULE SETS
# Definitions of logical rule groups.
# =============================================================================
rule_sets:
  # Default rules for general causal consistency
  maven-ere:
    - type: "three"
      if1:
        rel: "PRECONDITION"
      if2:
        rel: "CAUSE"
      then:
        rel: "PRECONDITION"
        dir: "13"
      negated: false

    # Three-mention rule: Transitivity for PRECONDITION
    - type: "three"
      if1:
        rel: "PRECONDITION"
      if2:
        rel: "PRECONDITION"
      then:
        rel: "PRECONDITION"
        dir: "13"
      negated: false

    - type: "three"
      if1:
        rel: "CAUSE"
      if2:
        rel: "CAUSE"
      then:
        rel: "CAUSE"
        dir: "13"
      negated: false

  meci:
    - type: "two"
      if:
        rel: "EffectCause"
      then:
        rel: "CauseEffect"
        dir: "21"
      negated: false

  causal_timebank:
    # No transitivity or symmetry rules — CLINKs are directed and sentence-local.
    # The corpus has only 6 transitivity opportunities (none annotated), so no rules needed.

  esl:
    # Transitivity of rising action (A causes B, B causes C -> A causes C)
    - type: "three"
      if1:
        rel: "FALLING_ACTION"
      if2:
        rel: "FALLING_ACTION"
      then:
        rel: "FALLING_ACTION"
        dir: "13"
      negated: false

    - type: "two"
      if:
        rel: "FALLING_ACTION"
      then:
        rel: "FALLING_ACTION"
        dir: "21"
      negated: false

    - type: "two"
      if:
        rel: "PRECONDITION"
      then:
        rel: "PRECONDITION"
        dir: "21"
      negated: false