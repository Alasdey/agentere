# =============================================================================
# PROMPTS
# Prompt files live in prompts/<name>.yaml — loaded on demand by load_config().
# The active prompt is determined by datasets.<active_dataset>.prompt
# =============================================================================

# =============================================================================
# RULE SETS
# Definitions of logical rule groups.
# =============================================================================
rule_sets:
  # Default rules for general causal consistency
  maven-ere:
    - type: "three"
      if1:
        rel: "PRECONDITION"
      if2:
        rel: "CAUSE"
      then:
        rel: "PRECONDITION"
        dir: "13"
      negated: false

    # Three-mention rule: Transitivity for PRECONDITION
    - type: "three"
      if1:
        rel: "PRECONDITION"
      if2:
        rel: "PRECONDITION"
      then:
        rel: "PRECONDITION"
        dir: "13"
      negated: false

    - type: "three"
      if1:
        rel: "CAUSE"
      if2:
        rel: "CAUSE"
      then:
        rel: "CAUSE"
        dir: "13"
      negated: false

  meci:
    - type: "two"
      if:
        rel: "EffectCause"
      then:
        rel: "CauseEffect"
        dir: "21"
      negated: false

  causal_timebank:
    # No transitivity or symmetry rules — CLINKs are directed and sentence-local.
    # The corpus has only 6 transitivity opportunities (none annotated), so no rules needed.

  esl:
    # Transitivity of rising action (A causes B, B causes C -> A causes C)
    - type: "three"
      if1:
        rel: "FALLING_ACTION"
      if2:
        rel: "FALLING_ACTION"
      then:
        rel: "FALLING_ACTION"
        dir: "13"
      negated: false

    - type: "two"
      if:
        rel: "FALLING_ACTION"
      then:
        rel: "FALLING_ACTION"
        dir: "21"
      negated: false

    - type: "two"
      if:
        rel: "PRECONDITION"
      then:
        rel: "PRECONDITION"
        dir: "21"
      negated: false