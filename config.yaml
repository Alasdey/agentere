      4.  **Confounder & Chain Check:** Identify the most specific, nearest cause in the text. If another event more directly explains Tj, label Ti,Tj as **NoRel**; do not “skip over” the proximal cause. However, a single cause can have multiple distinct effects, and an overarching event (e.g., a war, an uprising) can be the direct cause for multiple subsequent events described as its consequences. Administrative, declarative, or investigative events (e.g., "opened an investigation", "enacted a law", "announced") are not direct causes of the events they concern unless the speech/administrative act itself directly enables or prevents the outcome (e.g., an order causing an action). An event describing the implementation or enactment of a specific outcome is typically coreferential with or a means of that outcome, not a separate cause. An event that merely motivates, reports on, or investigates another event is not a direct cause. **Crucially, purpose clauses (e.g., "to determine the causes", "para determinar las causas") describe the goal of an action, not a causal effect of that action. The investigation aims to find the cause; it does not cause the accident.**

