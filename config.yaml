# =============================================================================
# GENERAL EXPERIMENT SETTINGS
# =============================================================================
mlflow:
  enabled: true
  log_causal_graphs: true  # render + upload a TP/FP/FN causal graph per document (requires mlflow.enabled)
  # tracking_uri: "mlruns"
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "agentere"

data:
  shuffle_pair_list: true         # shuffle pair order within each document at load time
                                   # (seeded per doc id — identical across runs)
  reshuffle_per_resample: true   # re-shuffle pair order independently for each resample run
                                   # (seeded per doc id + run index — identical across runs)
  binary_undirected: false        # global: collapse causes/causedby → CAUSAL and deduplicate pairs at load time
  vote_to_binary: false            # post-hoc: recombine directed causes/causedby vote_counts into a binary
                                   # causal/norel decision before metrics; model still predicts/loads gold
                                   # in directed 3-way space. Alternative to binary_undirected — don't set both true.
  binary_default: "norel"         # "norel" | "causal" — tie-break when causal vote count == norel vote count
                                   # under vote_to_binary
  novote_norel: true               # under vote_to_binary: when a pair's reverse direction was never
                                   # queried/voted on at all, count that missing slot as an implicit norel
                                   # vote (so a lone causal vote with no opposing direction is a tie too,
                                   # not an outright win). false = missing direction contributes no vote.
  labels:                         # uniform label set for all HF datasets
    - "causes"
    - "causedby"
    - "norel"


experiment:
  tracing: "false"
  # tracing_name: "DeepseekV32_meci_714_test_coh_count_resamp"
  tracing_name: "Toto_2"
  # tracing_name: "Meven-ERE-Eci"
  # tracing_name: "gpt5mini-MECI-714"
  # tracing_name: "Mistral-MECI-714-6"
  # tracing_name: "Autoprompt-meci-deepseek"
  # tracing_name: "2-Deepseekv3.2-coherence-encoder-714"
  enable_tools: false
  tools:
    # - "coherence" 
    # - "counterfactual_check"
    # - "encoder"
    # - "bare_causes"
    # - "eci"
    # - "reprompt"
  concurrency: 50
  retries: 3          # How many times to retry a failed sample
  timeout: 2400       # Seconds before a single inference attempt is cancelled and retried
  resampling:
    enabled: false
    n_runs: 3         # Votes per document
    tie_breaking: "norel"
    distinct_fewshots: false  # true: each resample run gets its own few-shot examples —
                              # selects n_runs * few_shot.n_examples docs and splits them
                              # round-robin across runs (pool must hold at least that many)


# ── Few-shot examples (used by the few_shot_examples tool) ──
few_shot:
  enabled: true
  split: "train"        # split to sample from (must exist in the active dataset's repo)
  n_examples: 3
  # pool_size: ~          # max training docs to load (null = full split); limits CoT generation cost
  pool_size: 20         # max training docs to load (null = full split); limits CoT generation cost
  systematic: true      # true: auto-inject before LLM call; false: agent calls the tool
  selection: "similarity"   
    # "random"     — resample every call for variance
    # "similarity" — TF-IDF cosine against the current doc text (sklearn required)
    # "mentions"   — Jaccard similarity on event mention text sets
    # "bert"       — cosine similarity on sentence-transformer embeddings
    # "smallest"   — Gets the doc with the smallest non negative pair_list (mostly for debuging)
  density_stratify: false  # true: force the chosen set to span low-to-high density (causal
                            # relations / mentions per doc) — one example per density quantile
                            # bin, ranked within each bin by `selection` (random tie-break for
                            # "random"/"smallest"). Composes with resampling.distinct_fewshots:
                            # each resample run's own set still spans the full density range.
  # bert_model: "all-MiniLM-L6-v2"  # used only when selection: "bert"
  bert_model: "all-roberta-large-v1"  # used only when selection: "bert"
  # repo_id: ~          # optional override; defaults to the active dataset's repo_id
  cot_generation:
    enabled: true      # true: generate realistic CoT few-shots via LLM
    num_steps: 2        # 2 (default): gold-guided generation -> decontaminate
                         # 3: blind generation (no golds) -> correct with golds -> decontaminate
                         # num_steps=3 only applies to single-call prompts (no `steps:` in the
                         # active prompt YAML); multi-step task prompts always use the 2-step protocol.
    same_sentence_only: false  # true: restrict the gold shown to the CoT-synthesis LLM (both the
                                # "correct labels are" hint and the non-CoT "Output:" fallback used
                                # when cot_generation.enabled is false) to only same-sentence
                                # (intra-sentence) gold triples, per doc["mention_sentence"].
                                # Does not affect doc selection or the few_shot_examples tool path.
    # cache_path: "logs/cot_cache.json"  # uncomment to persist generated CoTs across runs

# ── Reprompt tool ──
reprompt:
  systematic: false     # true: auto-inject reprompt just after few_shot; false: agent calls the tool

# ── Per-tool model overrides ──
tools_config:
  eci_extractor:
    model_id: "deepseek/deepseek-v3.2"
    concurrency: 10

# ── Encoder baseline predictions (used by the encoder tool) ──
encoder:
  # path: "encoder_baseline/logs/EventStoryLine-1.5-Causal_test_2026_02_13_09_32_58/predictions.json"
  path: "encoder_baseline/logs/MAVEN-ERE-Causal-Events_test_2026_02_12_14_51_27/predictions.json"
  filter_norel:
    enabled: true
    delta: 0.20   # keep NoRel pairs only when max relation prob ≥ threshold − delta

